function BrandLogo({marca,size=40}){
  const logo=BRAND_LOGOS[marca];
  if(logo)return h("div",{style:{width:size,height:size,borderRadius:size*0.28,overflow:"hidden",flexShrink:0}},logo);
  // Generic fallback: first 2 letters
  const initials=(marca||"?").slice(0,2).toUpperCase();
  const colors=["#6c5ce7","#00b894","#e17055","#0984e3","#fd79a8","#fdcb6e"];
  const ci=marca.charCodeAt(0)%colors.length;
  return h("div",{style:{width:size,height:size,borderRadius:size*0.28,background:colors[ci],display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.35,fontWeight:900,color:"#fff",flexShrink:0,fontFamily:"inherit"}},initials);
}

function App(){
  const [records,setRecords]=useState(()=>load("tm_records",[]));
  const [tipos,setTipos]=useState(()=>load("tm_tipos",DEFAULT_TIPOS));
  const [herramientas,setHerramientas]=useState(()=>load("tm_herr",DEFAULT_HERRAMIENTAS));
  const [metodos,setMetodos]=useState(()=>load("tm_met",DEFAULT_METODOS));
  const [marcas,setMarcas]=useState(()=>load("tm_marcas",DEFAULT_MARCAS));
  const [colores,setColores]=useState(()=>load("tm_colores",DEFAULT_COLORES));
  const [tecnicos,setTecnicos]=useState(()=>load("tm_tecnicos",DEFAULT_TECNICOS));

  const [activeTab,setActiveTab]=useState("buscar");
  const [showForm,setShowForm]=useState(false);
  const [editRec,setEditRec]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [toast,setToast]=useState(null);
  const [searchQ,setSearchQ]=useState("");
  const [filterEstado,setFilterEstado]=useState("todos");
  const [filterMarca,setFilterMarca]=useState("todas");
  const [settingsTab,setSettingsTab]=useState("marcas");
  const [showMarcaPicker,setShowMarcaPicker]=useState(false);
  const fileInputRef=useRef();

  const emptyForm={
    ticket:"",marca:marcas[0]||"",modelo:"",color:colores[0]||"",
    tipo:tipos[0]||"",herramienta:herramientas[0]||"",metodo:metodos[0]||"",
    tecnico:tecnicos[0]||"",fecha:todayStr,precio:"",estado:"Exitoso",notas:"",imei:""
  };
  const [form,setForm]=useState(emptyForm);

  useEffect(()=>save("tm_records",records),[records]);
  useEffect(()=>save("tm_tipos",tipos),[tipos]);
  useEffect(()=>save("tm_herr",herramientas),[herramientas]);
  useEffect(()=>save("tm_met",metodos),[metodos]);
  useEffect(()=>save("tm_marcas",marcas),[marcas]);
  useEffect(()=>save("tm_colores",colores),[colores]);
  useEffect(()=>save("tm_tecnicos",tecnicos),[tecnicos]);

  function showToast(msg,type="ok"){setToast({msg,type});setTimeout(()=>setToast(null),2600);}

  const filtered=useMemo(()=>{
    let list=[...records];
    if(filterEstado!=="todos")list=list.filter(r=>r.estado===filterEstado);
    if(filterMarca!=="todas")list=list.filter(r=>r.marca===filterMarca);
    if(searchQ.trim()){
      const q=searchQ.toLowerCase();
      list=list.filter(r=>
        (r.modelo||"").toLowerCase().includes(q)||
        (r.marca||"").toLowerCase().includes(q)||
        (r.tipo||"").toLowerCase().includes(q)||
        (r.herramienta||"").toLowerCase().includes(q)||
        (r.metodo||"").toLowerCase().includes(q)||
        (r.notas||"").toLowerCase().includes(q)||
        (r.imei||"").toLowerCase().includes(q)||
        (r.ticket||"").toLowerCase().includes(q)||
        (r.tecnico||"").toLowerCase().includes(q)
      );
    }
    return list.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  },[records,searchQ,filterEstado,filterMarca]);

  const stats=useMemo(()=>({
    total:records.length,
    exitosos:records.filter(r=>r.estado==="Exitoso").length,
    enproceso:records.filter(r=>r.estado==="En proceso").length,
    fallidos:records.filter(r=>r.estado==="Fallido").length,
    pendientes:records.filter(r=>r.estado==="Pendiente").length,
    mes:records.filter(r=>{const d=new Date(r.fecha+"T00:00:00");return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();}).length,
  }),[records]);

  function handleSave(){
    if(!form.modelo.trim()){showToast("Ingresa el modelo","err");return;}
    const rec={...form,id:editRec?editRec.id:genId()};
    if(editRec){setRecords(rs=>rs.map(r=>r.id===editRec.id?rec:r));showToast("Actualizado ✓");}
    else{setRecords(rs=>[rec,...rs]);showToast("Proceso guardado ✓");}
    setShowForm(false);setEditRec(null);setForm(emptyForm);
  }
  function handleDelete(id){setRecords(rs=>rs.filter(r=>r.id!==id));setConfirmDel(null);setViewRec(null);showToast("Eliminado");}
  function startEdit(r){setForm({...r});setEditRec(r);setShowForm(true);setViewRec(null);}

  function exportJSON(){
    const data={records,tipos,herramientas,metodos,marcas,colores,tecnicos,exported:new Date().toISOString(),version:2};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`tecnomaya_backup_${todayStr}.json`;a.click();URL.revokeObjectURL(url);showToast("Backup exportado ✓");
  }
  function exportCSV(){
    const rows=[["Ticket","Fecha","Marca","Modelo","Color","Tipo","Herramienta","Método","Técnico","Precio","Estado","IMEI","Notas"]];
    records.forEach(r=>rows.push([r.ticket||"",r.fecha,r.marca,r.modelo,r.color||"",r.tipo,r.herramienta,r.metodo,r.tecnico||"",r.precio||"",r.estado,r.imei||"",r.notas||""]));
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`tecnomaya_${todayStr}.csv`;a.click();URL.revokeObjectURL(url);showToast("CSV exportado ✓");
  }
  function importJSON(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.records)setRecords(data.records);
        if(data.tipos)setTipos(data.tipos);
        if(data.herramientas)setHerramientas(data.herramientas);
        if(data.metodos)setMetodos(data.metodos);
